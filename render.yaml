# Dueño: Julian · Cómo Render publica The Trace (ADR-0004). Render lee este archivo al crear
# el "Blueprint": un servicio para la API y un sitio estático para la web, publicados desde main.
# Las claves NO van aquí: las que dicen `sync: false` se escriben a mano en el panel de Render.
services:
  # ---- API (FastAPI) ----
  - type: web
    name: trace-api
    runtime: python
    plan: free               # se duerme a los 15 minutos: un despertador la visita cada 10 (guía rápida)
    region: oregon
    branch: main
    rootDir: api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # El plan gratis no tiene Pre-Deploy: los cambios a la base se aplican al arrancar (si ya están, no hace nada).
    startCommand: uv run alembic upgrade head && uv run fastapi run app/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PRICE_PROVIDER
        value: yahoo
      - key: PRICE_REFRESH_MINUTES
        value: "15"
      - key: WEB_ORIGIN
        value: https://CAMBIAR-por-la-url-de-trace-web.onrender.com

  # ---- Web (React) ----
  - type: web
    name: trace-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite        # la app maneja sus propias rutas (/hoy, /portafolio…)
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trace-api-jlj7.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
